databaseChangeLog:
  - changeSet:
      id: "001-create-liquibase-test-table"
      author: "willy"
      changes:
        - createTable:
            tableName: "liquibase_test"
            columns:
              - column:
                  name: "id"
                  type: "BIGINT"
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: "message"
                  type: "VARCHAR(255)"
  - changeSet:
      id: "002-drop-liquibase-test-table"
      author: "willy"
      changes:
        - dropTable:
            tableName: "liquibase_test"
  - changeSet:
      id: "003-create-internships-table"
      author: "willy"
      changes:
        - createTable:
            tableName: "internships"
            columns:
              - column:
                  name: "id"
                  type: "BIGINT"
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: "title"
                  type: "VARCHAR(255)"
                  constraints:
                    nullable: false
              - column:
                  name: "company"
                  type: "VARCHAR(255)"
                  constraints:
                    nullable: false
              - column:
                  name: "duration_in_months"
                  type: "INTEGER"
                  constraints:
                    nullable: false
  - changeSet:
      id: "004-add-status-to-internships"
      author: "willy"
      changes:
        - addColumn:
            tableName: "internships"
            columns:
              - column:
                  name: "status"
                  type: "VARCHAR(50)"
                  defaultValue: "OPEN"
                  constraints:
                    nullable: false
  - changeSet:
      id: "005-create-students-table"
      author: "willy"
      changes:
        - createTable:
            tableName: "students"
            columns:
              - column:
                  name: "id"
                  type: "BIGINT"
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: "first_name"
                  type: "VARCHAR(255)"
                  constraints:
                    nullable: false
              - column:
                  name: "last_name"
                  type: "VARCHAR(255)"
                  constraints:
                    nullable: false
              - column:
                  name: "university"
                  type: "VARCHAR(255)"
              - column:
                  name: "birth_date"
                  type: "DATE"

  - changeSet:
      id: "006-add-student-id-to-internships"
      author: "willy"
      changes:
        - addColumn:
            tableName: "internships"
            columns:
              - column:
                  name: "student_id"
                  type: "BIGINT"
        - addForeignKeyConstraint:
            baseTableName: "internships"
            baseColumnNames: "student_id"
            referencedTableName: "students"
            referencedColumnNames: "id"
            constraintName: "fk_internships_student"

  - changeSet:
      id: "007-create-tasks-table"
      author: "willy"
      changes:
        - createTable:
            tableName: "tasks"
            columns:
              - column:
                  name: "id"
                  type: "BIGINT"
                  autoIncrement: true
                  constraints:
                   primaryKey: true
                   nullable: false
              - column:
                  name: "title"
                  type: "VARCHAR(255)"
                  constraints:
                    nullable: false
              - column:
                  name: "description"
                  type: "VARCHAR(255)"
              - column:
                  name: "completed"
                  type: "BOOLEAN"
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: "internship_id"
                  type: "BIGINT"
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: "tasks"
            baseColumnNames: "internship_id"
            referencedTableName: "internships"
            referencedColumnNames: "id"
            constraintName: "fk_tasks_internship"
  - changeSet:
      id: "008-create-mentors-table"
      author: "willy"
      changes:
        - createTable:
            tableName: "mentors"
            columns:
              - column:
                  name: "id"
                  type: "BIGINT"
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: "first_name"
                  type: "VARCHAR(255)"
                  constraints:
                    nullable: false
              - column:
                  name: "last_name"
                  type: "VARCHAR(255)"
                  constraints:
                    nullable: false
              - column:
                  name: "email"
                  type: "VARCHAR(255)"
                  constraints:
                    nullable: false
  - changeSet:
      id: "009-add-mentor-id-to-internships"
      author: "willy"
      changes:
        - addColumn:
            tableName: "internships"
            columns:
              - column:
                  name: "mentor_id"
                  type: "BIGINT"
        - addForeignKeyConstraint:
            baseTableName: "internships"
            baseColumnNames: "mentor_id"
            referencedTableName: "mentors"
            referencedColumnNames: "id"
            constraintName: "fk_internships_mentor"