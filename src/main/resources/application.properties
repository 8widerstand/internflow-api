spring.application.name=internflow-api

spring.datasource.url=jdbc:postgresql://localhost:5433/internflow
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=internflow_user
spring.datasource.password=internflow_password

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml

# H2 console is disabled because the application now uses PostgreSQL.
